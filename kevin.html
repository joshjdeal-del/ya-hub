<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#2f5d2a">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Kevin Hours">
<link rel="apple-touch-icon" href="icon-192.png">
<title>Kevin's Hours</title>
<style>
:root{--g:#2f5d2a;--g2:#e7f1e4;--bg:#f2f6f0;--card:#fff;--line:#dfe6db;--ink:#1c241b;--mut:#66735f;--red:#b3261e;--amb:#9a6200;--amb2:#fdf3dc;--blue:#1d5fa8}
*{box-sizing:border-box}
body{margin:0;font:16px/1.4 -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif;background:var(--bg);color:var(--ink);-webkit-text-size-adjust:100%}
header{background:var(--g);color:#fff;padding:12px 16px;padding-top:calc(12px + env(safe-area-inset-top));display:flex;justify-content:space-between;align-items:center;position:sticky;top:0;z-index:5}
header b{font-size:17px}
header button{background:transparent;border:1px solid rgba(255,255,255,.5);color:#fff;border-radius:8px;padding:5px 10px;font-size:13px}
main{max-width:640px;margin:0 auto;padding:12px 12px 90px}
.card{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:14px;margin:0 0 12px}
h2{font-size:13px;margin:0 0 10px;color:var(--mut);text-transform:uppercase;letter-spacing:.05em;display:flex;justify-content:space-between;align-items:center;gap:8px}
h3{margin:0 0 6px;font-size:18px;padding-right:44px}
label{display:block;font-size:13px;color:var(--mut);margin:10px 0 4px}
input,select,textarea{width:100%;font:inherit;padding:11px;border:1px solid #c9d3c4;border-radius:10px;background:#fff;color:var(--ink)}
textarea{min-height:70px;resize:vertical}
button{font:inherit;cursor:pointer}
.b{display:block;width:100%;border:0;border-radius:12px;padding:14px;font-weight:600;font-size:16px;background:var(--g);color:#fff;margin-top:10px}
.b.alt{background:var(--g2);color:var(--g)}
.b.red{background:var(--red)}
.b.ghost{background:transparent;color:var(--mut);font-weight:500}
.s{border:1px solid #c9d3c4;background:#fff;border-radius:8px;padding:6px 10px;font-size:13px;color:var(--ink)}
.mut{color:var(--mut)}.sm{font-size:13px}
.big{font-size:40px;font-weight:700;letter-spacing:-.02em;font-variant-numeric:tabular-nums}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.grid3{display:grid;grid-template-columns:1fr 1fr 1fr;gap:8px;text-align:center}
.grid3 b{display:block;font-size:22px;font-variant-numeric:tabular-nums}
.row{display:flex;gap:10px;align-items:flex-start;padding:10px 0;border-top:1px solid var(--line)}
.row:first-child{border-top:0}
.row .f{flex:1;min-width:0}
.row .n{font-variant-numeric:tabular-nums;font-weight:600;white-space:nowrap}
.tap{cursor:pointer}
.pill{display:inline-block;font-size:11px;border-radius:99px;padding:2px 8px;background:var(--g2);color:var(--g);font-weight:600;white-space:nowrap}
.pill.amb{background:var(--amb2);color:var(--amb)}.pill.gray{background:#eceeea;color:var(--mut)}.pill.blue{background:#e3eefb;color:var(--blue)}
.chk{width:26px;height:26px;border:2px solid #9fb09a;border-radius:7px;flex:none;display:flex;align-items:center;justify-content:center;color:#fff;font-weight:700;margin-top:2px}
.chk.on{background:var(--g);border-color:var(--g)}
.tabs{display:flex;gap:6px;margin:0 0 10px;flex-wrap:wrap}
.tabs button{border:1px solid #c9d3c4;background:#fff;border-radius:99px;padding:7px 13px;font-size:14px;color:var(--ink)}
.tabs button.on{background:var(--g);border-color:var(--g);color:#fff}
.wk{font-size:13px;color:var(--mut);font-weight:600;display:flex;justify-content:space-between;padding:12px 0 2px;border-top:2px solid var(--line)}
.wk:first-child{border-top:0;padding-top:0}
#sheet{position:fixed;inset:0;background:rgba(0,0,0,.45);display:none;align-items:flex-end;justify-content:center;z-index:20}
#sheetIn{background:var(--bg);width:100%;max-width:640px;max-height:92vh;overflow:auto;border-radius:18px 18px 0 0;padding:16px 16px calc(20px + env(safe-area-inset-bottom))}
.sxw{position:sticky;top:0;height:0;z-index:6;text-align:right}.sx{width:38px;height:38px;border-radius:19px;border:1px solid #cfd6cc;background:#fff;color:#333;font-size:17px;padding:0;margin:-6px -6px 0 0;box-shadow:0 1px 4px rgba(0,0,0,.15)}
#toast{position:fixed;left:50%;bottom:26px;transform:translateX(-50%);background:#1c241b;color:#fff;padding:10px 16px;border-radius:99px;font-size:14px;display:none;z-index:30}
#bar{position:fixed;left:0;right:0;bottom:0;background:#fff;border-top:1px solid var(--line);padding:10px 12px calc(10px + env(safe-area-inset-bottom));display:none;z-index:8}
#bar .in{max-width:640px;margin:0 auto;display:flex;gap:8px;align-items:center}
.pad{max-width:300px;margin:8vh auto 0;text-align:center}
.dots{font-size:34px;letter-spacing:10px;height:46px}
.keys{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin-top:14px}
.keys button{padding:18px 0;font-size:22px;border-radius:14px;border:1px solid #c9d3c4;background:#fff;color:var(--ink)}
.card.col>h2{cursor:pointer;margin-bottom:0;user-select:none;-webkit-user-select:none}.card.col.open>h2{margin-bottom:10px}.card.col:not(.open)>*:not(h2){display:none!important}.chv{display:inline-block;width:16px;font-style:normal}
</style>
</head>
<body>
<header><b id="ttl">Kevin's Hours</b><span id="who"></span></header>
<main id="app"></main>
<div id="bar"><div class="in" id="barIn"></div></div>
<div id="sheet" onclick="if(event.target===this)closeSheet()"><div id="sheetIn"></div></div>
<div id="toast"></div>
<script>
var VERSION = 11;
var SB = 'https://ozjlcmyheosczikxnfxk.supabase.co';
var KEY = 'sb_publishable_qFb_Fu730Wqx8mtmtA_Yyg_rNzCuY3h';
var TOKEN = '', S = null, FILT = 'all', SEL = {}, TICK = null, LOGN = 10;
function $(i){return document.getElementById(i);}
function esc(s){return String(s==null?'':s).replace(/[&<>"']/g,function(c){return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c];});}
function store(k,v){try{if(v==null)localStorage.removeItem(k);else localStorage.setItem(k,v);}catch(e){}}
function load(k){try{return localStorage.getItem(k)||'';}catch(e){return '';}}
function toast(t){var e=$('toast');e.textContent=t;e.style.display='block';clearTimeout(toast.t);toast.t=setTimeout(function(){e.style.display='none';},2200);}
function rpc(fn,args){
  return fetch(SB+'/rest/v1/rpc/'+fn,{method:'POST',headers:{'Content-Type':'application/json',apikey:KEY,Authorization:'Bearer '+KEY},body:JSON.stringify(args||{})})
    .then(function(r){return r.text().then(function(t){var d=null;try{d=t?JSON.parse(t):null;}catch(e){}
      if(!r.ok){var m=(d&&(d.message||d.error))||('Error '+r.status);if(m==='signin'){signOut(true);throw new Error('Signed out');}throw new Error(m);}return d;});});
}
function act(fn,args,ok){return rpc(fn,args).then(function(){return refresh();}).then(function(){if(ok)ok();}).catch(function(e){if(e.message!=='Signed out')alert(e.message);});}
function pad2(n){return (n<10?'0':'')+n;}
function ymd(t){var d=new Date(t);return d.getFullYear()+'-'+pad2(d.getMonth()+1)+'-'+pad2(d.getDate());}
function hhmm(t){var d=new Date(t);return pad2(d.getHours())+':'+pad2(d.getMinutes());}
function tm(t){var d=new Date(t),h=d.getHours(),m=d.getMinutes();return ((h%12)||12)+':'+pad2(m)+(h<12?' AM':' PM');}
function dlbl(s){var d=new Date(s+'T12:00:00');return ['Sun','Mon','Tue','Wed','Thu','Fri','Sat'][d.getDay()]+' '+(d.getMonth()+1)+'/'+d.getDate()+(d.getFullYear()!==new Date().getFullYear()?'/'+String(d.getFullYear()).slice(2):'');}
function hrs(e){return ((e.end_at?new Date(e.end_at):new Date())-new Date(e.start_at))/36e5;}
function f2(n){return (Math.round(n*100)/100).toFixed(2);}
function hm(h){var m=Math.round(h*60);return Math.floor(m/60)+'h '+pad2(m%60)+'m';}
function monday(s){var d=new Date(s+'T12:00:00');d.setDate(d.getDate()-d.getDay());return ymd(d);}
var PREVIEW=false;
function realOwner(){return S&&S.me.owner;}
function owner(){return S&&S.me.owner&&!PREVIEW;}
function pv(){if(PREVIEW){alert('This is a preview of '+S.who+'\'s view. Nothing is saved from here. Tap "Back to my view" to make changes.');return true;}return false;}
function setPreview(on){PREVIEW=on;SEL={};closeSheet();render();window.scrollTo(0,0);}
function running(){return (S.entries||[]).filter(function(e){return !e.end_at;})[0]||null;}
function done(){return (S.entries||[]).filter(function(e){return e.end_at&&e.status!=='pending';});}
function reqs(){return (S.entries||[]).filter(function(e){return e.end_at&&(e.status==='pending'||e.proposed);});}
function span(a,b){return dlbl(ymd(a))+' '+tm(a)+' – '+tm(b)+' ('+f2((new Date(b)-new Date(a))/36e5)+' h)';}
function reqCard(){
  var l=reqs();if(!l.length)return '';
  return '<div class="card" style="border-color:var(--amb)"><h2>'+(owner()?'Requests from '+esc(S.who):'Waiting on Josh')+' <span>'+l.length+'</span></h2>'+l.map(function(e){
    var add=e.status==='pending',p=e.proposed||{};
    return '<div class="row"><div class="f"><div><b>'+(add?'Add time':'Change time')+'</b></div>'+
      (add?'<div class="sm">'+span(e.start_at,e.end_at)+'</div><div class="sm">'+esc(lbl(e))+'</div>'
          :'<div class="sm mut">Now: '+span(e.start_at,e.end_at)+' · '+esc(lbl(e))+'</div><div class="sm">Wants: '+span(p.start_at,p.end_at)+' · '+esc(lbl({kind:p.kind,job:p.job}))+'</div>')+
      (e.note?'<div class="mut sm" style="white-space:pre-wrap">'+esc(e.note)+'</div>':'')+
      (owner()?'<div style="margin-top:6px;display:flex;gap:8px"><button class="s" style="background:var(--g);color:#fff;border-color:var(--g)" onclick="decide(\''+e.id+'\',true)">Approve</button><button class="s" onclick="decide(\''+e.id+'\',false)">Decline</button></div>'
              :(add?'<div style="margin-top:6px"><button class="s" onclick="delEnt(\''+e.id+'\')">Cancel request</button></div>':''))+'</div></div>';}).join('')+
    (owner()?'':'<div class="mut sm" style="margin-top:6px">These do not count until Josh approves them.</div>')+'</div>';
}
function decide(id,ok){if(!ok&&!confirm('Decline this request?'))return;act('crew_decide',{p_token:TOKEN,p_id:id,p_ok:ok},function(){toast(ok?'Approved':'Declined');});}
function lbl(e){return e.kind==='ya'?('Yield Advantage'+(e.job?': '+e.job:'')):e.kind==='dealag'?('Deal Ag'+(e.task?': '+e.task:' (Justin)')):'Farm';}
function boss(){return owner()?'me':'Josh';}
function owedBy(e){return e.kind==='dealag'?'Deal Ag':'YA';}
function sumH(l){return l.reduce(function(a,e){return a+hrs(e);},0);}
function trackCard(){
  var all=done(),row=function(name,l){var owe=l.filter(function(e){return !e.reimbursed_at;});
    return '<div class="row"><div class="f"><b>'+name+'</b></div><div style="text-align:right;min-width:62px"><b>'+f2(sumH(l))+'</b><div class="mut sm">worked</div></div><div style="text-align:right;min-width:62px"><b>'+f2(sumH(l)-sumH(owe))+'</b><div class="mut sm">paid back</div></div><div style="text-align:right;min-width:62px"><b style="color:'+(owe.length?'var(--amb)':'inherit')+'">'+f2(sumH(owe))+'</b><div class="mut sm">still owed</div></div></div>';};
  var da=all.filter(function(e){return e.kind==='dealag'&&e.reimburse;}),ya=all.filter(function(e){return e.kind==='ya'&&e.reimburse;}),own=all.filter(function(e){return e.kind==='ya'&&!e.reimburse;});
  return '<div class="card"><h2>Worked for others <span>owed back to '+boss()+'</span></h2>'+row('Deal Ag (Justin)',da)+row('Yield Advantage',ya)+
    '<div class="mut sm" style="margin-top:8px">Hours '+(owner()?'Kevin':'you')+' worked for Deal Ag or on Yield Advantage customer jobs, which get paid back to '+boss()+'.'+(own.length?' Not counted here: '+f2(sumH(own))+' h on Josh\'s own Yield Advantage jobs (like the sprayer).':'')+'</div></div>';
}

/* ---- sign in ---- */
var CODE='';
function padView(msg){
  S=null;$('who').innerHTML='';$('bar').style.display='none';
  $('app').innerHTML='<div class="pad"><h3 style="padding:0">Enter your code</h3><div class="dots" id="dots"></div><div class="mut sm" id="pmsg" style="min-height:38px;color:var(--red)">'+esc(msg||'')+'</div><div class="keys">'+
    [1,2,3,4,5,6,7,8,9,'',0,'⌫'].map(function(k){return k===''?'<span></span>':'<button onclick="key(\''+k+'\')">'+k+'</button>';}).join('')+'</div></div>';
  CODE='';
}
function key(k){
  if(k==='⌫')CODE=CODE.slice(0,-1);else if(CODE.length<4)CODE+=k;
  $('dots').textContent='●'.repeat(CODE.length);
  if(CODE.length===4){var c=CODE;CODE='';
    rpc('crew_login',{p_code:c}).then(function(r){if(!r.ok){padView(r.why);return;}TOKEN=r.token;store('kvToken',TOKEN);boot();}).catch(function(e){padView(e.message);});}
}
function signOut(silent){PREVIEW=false;KPAY=null;if(TOKEN&&!silent)rpc('crew_logout',{p_token:TOKEN}).catch(function(){});TOKEN='';store('kvToken',null);clearInterval(TICK);closeSheet();padView();}
function refresh(){return rpc('crew_state',{p_token:TOKEN}).then(function(st){S=st;render();});}
function boot(){
  refresh().then(function(){clearInterval(boot.t);boot.t=setInterval(function(){if(!document.hidden&&TOKEN&&$('sheet').style.display!=='flex'){var ae=document.activeElement;if(ae&&/TEXTAREA|INPUT|SELECT/.test(ae.tagName))return;refresh().catch(function(){});}},30000);})
   .catch(function(e){if(e.message!=='Signed out')padView(e.message);});
}
document.addEventListener('visibilitychange',function(){if(!document.hidden&&TOKEN&&S)refresh().catch(function(){});});

/* ---- sections that open and close (closed to start) ---- */
var OPEN={};try{OPEN=JSON.parse(load('kvOpen')||'{}')||{};}catch(e){OPEN={};}
function collapse(){
  var cs=$('app').querySelectorAll('.card');
  for(var i=0;i<cs.length;i++){(function(c){
    var h=c.querySelector('h2');if(!h||h.parentNode!==c)return;var n=h.childNodes[0];if(!n||n.nodeType!==3)return;
    var t=n.textContent.trim(),k=/^My hours/.test(t)?'hours':/^Ledger/.test(t)?'ledger':/^Paystubs/.test(t)?'stubs':/^Changes/.test(t)?'log':/sign-ins$/.test(t)?'logins':/^Setup/.test(t)?'setup':'';
    if(!k)return;k=(owner()?'o:':'k:')+k;
    var w=document.createElement('span');w.innerHTML='<i class="chv"></i>';w.appendChild(document.createTextNode(n.textContent));h.replaceChild(w,n);
    var set=function(){c.classList.toggle('open',!!OPEN[k]);w.firstChild.textContent=OPEN[k]?'▾':'▸';};
    c.classList.add('col');set();
    h.onclick=function(ev){if(ev.target.closest('button'))return;OPEN[k]=!OPEN[k];store('kvOpen',JSON.stringify(OPEN));set();};
  })(cs[i]);}
}

/* ---- sheet ---- */
function sheet(h){$('sheetIn').innerHTML='<div class="sxw"><button class="sx" onclick="closeSheet()" aria-label="Close">✕</button></div>'+h;$('sheet').style.display='flex';$('sheetIn').scrollTop=0;}
function closeSheet(){$('sheet').style.display='none';}
function where(){return new Promise(function(res){if(!navigator.geolocation)return res({});var d=false;var t=setTimeout(function(){if(!d){d=true;res({});}},7000);
  navigator.geolocation.getCurrentPosition(function(p){if(d)return;d=true;clearTimeout(t);res({lat:p.coords.latitude,lng:p.coords.longitude,acc:p.coords.accuracy});},function(){if(d)return;d=true;clearTimeout(t);res({});},{enableHighAccuracy:true,timeout:6500,maximumAge:60000});});}
function workOpts(kind,job,task){
  var ya=S.jobs.filter(function(j){return j.cust;}),other=S.jobs.filter(function(j){return !j.cust;});
  var o=function(j){return '<option value="'+j.id+'"'+(kind==='ya'&&job===j.id?' selected':'')+'>'+esc(j.label)+'</option>';};
  return '<option value="farm"'+(kind!=='ya'&&kind!=='dealag'?' selected':'')+'>Farm (Ideal Farms)</option>'+
    '<optgroup label="Deal Ag (Justin)"><option value="dealag"'+(kind==='dealag'&&!task?' selected':'')+'>Deal Ag (general)</option>'+(S.dealag_types||[]).map(function(t){return '<option value="dealag:'+esc(t)+'"'+(kind==='dealag'&&task===t?' selected':'')+'>Deal Ag: '+esc(t)+'</option>';}).join('')+
      (kind==='dealag'&&task&&(S.dealag_types||[]).indexOf(task)<0?'<option value="dealag:'+esc(task)+'" selected>Deal Ag: '+esc(task)+'</option>':'')+'</optgroup>'+
    '<option value="ya"'+(kind==='ya'&&!job?' selected':'')+'>Yield Advantage (no specific job)</option>'+
    (ya.length?'<optgroup label="Yield Advantage jobs">'+ya.map(o).join('')+'</optgroup>':'')+
    (other.length?'<optgroup label="Yield Advantage shop / other">'+other.map(o).join('')+'</optgroup>':'');
}
function pick(id){var v=$(id).value;if(v.indexOf('dealag:')===0)return {kind:'dealag',job:null,task:v.slice(7),send:v,raw:v};return (v==='farm'||v==='dealag'||v==='ya')?{kind:v,job:null,send:v,raw:v}:{kind:'ya',job:v,send:'ya',raw:v};}

/* ---- render ---- */
function render(){
  $('ttl').textContent=owner()?S.who+"'s Hours":'My Hours';
  $('who').innerHTML=(realOwner()&&!PREVIEW?'<button onclick="setPreview(true)">'+esc(S.who)+'\'s view</button> ':'')+'<button onclick="signOut()">Sign out</button>';
  var keep={},rid=(running()||{}).id||'';if($('cn'))keep.cn=$('cn').value;if($('rn')&&render.rid===rid)keep.rn=$('rn').value;render.rid=rid;
  $('app').innerHTML=(PREVIEW?'<div class="card" style="border-color:var(--amb);background:var(--amb2)"><b>'+esc(S.who)+'\'s view</b><div class="sm">This is what '+esc(S.who)+' sees when he signs in. It is a preview, so nothing can be changed from here.</div><button class="b alt" style="margin-top:8px" onclick="setPreview(false)">Back to my view</button></div>':'')+(owner()?vOwner():vCrew());
  ['cn','rn'].forEach(function(i){if($(i)&&keep[i]!=null&&document.activeElement!==$(i))$(i).value=keep[i];});
  collapse();bar();clearInterval(TICK);
  if(running())TICK=setInterval(function(){var r=running(),el=$('el');if(r&&el)el.textContent=hm(hrs(r));},20000);
}
function totals(list){var w=0,p=0;list.forEach(function(e){var h=hrs(e);w+=h;if(e.paid_at)p+=h;});return {w:w,p:p,u:w-p};}
function totalsCard(){
  var t=totals(done()),wk=monday(ymd(new Date())),tw=0;done().forEach(function(e){if(monday(ymd(e.start_at))===wk)tw+=hrs(e);});var r=running();if(r&&monday(ymd(r.start_at))===wk)tw+=hrs(r);
  return '<div class="card"><h2>Hours</h2><div style="display:flex;justify-content:space-between;align-items:baseline;margin:0 0 12px;padding:0 0 10px;border-bottom:1px solid var(--line,#ddd)"><div><b>This week</b><div class="mut sm">since Sunday, '+dlbl(wk)+'</div></div><b style="font-size:26px">'+f2(tw)+' h</b></div><div class="grid3"><div><b>'+f2(t.w)+'</b><span class="mut sm">worked</span></div><div><b>'+f2(t.p)+'</b><span class="mut sm">paid</span></div><div><b style="color:'+(t.u>0.005?'var(--amb)':'inherit')+'">'+f2(t.u)+'</b><span class="mut sm">not paid yet</span></div></div></div>';
}
function entRow(e,sel){
  var imp=e.source==='import';
  return '<div class="row tap" onclick="'+(sel?'tog(\''+e.id+'\')':'entForm(\''+e.id+'\')')+'">'+(sel?'<div class="chk'+(SEL[e.id]?' on':'')+'">'+(SEL[e.id]?'✓':'')+'</div>':'')+
    '<div class="f"><div>'+dlbl(ymd(e.start_at))+(imp?'':' <span class="mut sm">'+tm(e.start_at)+' – '+tm(e.end_at)+'</span>')+'</div>'+
    '<div class="sm">'+(e.kind==='ya'?'<span class="pill blue">YA</span> '+esc(e.job||'Yield Advantage'):e.kind==='dealag'?'<span class="pill blue">Deal Ag</span> '+esc(e.task||'Justin'):'<span class="pill gray">Farm</span>')+'</div>'+
    (e.note?'<div class="mut sm" style="white-space:pre-wrap">'+esc(e.note)+'</div>':'')+
    '<div style="margin-top:3px">'+(e.paid_at?'<span class="pill">paid '+dlbl(e.paid_at)+(e.paid_ref?' · '+esc(e.paid_ref):'')+'</span>':'<span class="pill amb">not paid</span>')+
      (e.reimburse?(e.reimbursed_at?' <span class="pill">'+owedBy(e)+' paid '+boss()+' back '+dlbl(e.reimbursed_at)+'</span>':' <span class="pill amb">'+owedBy(e)+' owes '+boss()+'</span>'):'')+
      (owner()&&e.edited?' <span class="pill amb">'+esc(S.who)+' added or changed '+dlbl(ymd(e.edited_at))+' '+tm(e.edited_at)+'</span>':'')+(owner()&&sel?' <button class="s" style="padding:2px 8px" onclick="event.stopPropagation();entForm(\''+e.id+'\')">Edit</button>':'')+'</div></div>'+
    '<div class="n">'+f2(hrs(e))+'</div></div>';
}
function listHtml(list,sel){
  if(!list.length)return '<div class="mut">Nothing here</div>';
  var out='',cur='',sums={};list.forEach(function(e){var w=monday(ymd(e.start_at));sums[w]=(sums[w]||0)+hrs(e);});

}

/* ---- owner ---- */
function place(lat,lng){
  var best=null;(S.places||[]).forEach(function(p){var R=3958.8,x=(lng-p.lng)*Math.PI/180*Math.cos((lat+p.lat)*Math.PI/360),y=(lat-p.lat)*Math.PI/180,m=Math.sqrt(x*x+y*y)*R;if(!best||m<best.m)best={n:p.name,m:m};});
  return best?(best.m<1?'at '+esc(best.n):f2(best.m)+' mi from '+esc(best.n)):'location saved';
}
/* ===== payroll reminder (owner only): OnPay, twice a month ===== */
var KPAY=null,KPAY_BUSY=false;
function kAdd(s,n){var d=new Date(s+'T12:00:00');d.setDate(d.getDate()+n);return ymd(d);}
function kNth(y,m,wd,n){var d=new Date(y,m,1,12),c=0;while(true){if(d.getDay()===wd&&++c===n)return ymd(d);d.setDate(d.getDate()+1);}}
function kLast(y,m,wd){var d=new Date(y,m+1,0,12);while(d.getDay()!==wd)d.setDate(d.getDate()-1);return ymd(d);}
function kObs(y,m,day){var d=new Date(y,m,day,12);if(d.getDay()===6)d.setDate(d.getDate()-1);if(d.getDay()===0)d.setDate(d.getDate()+1);return ymd(d);}
function kHol(y){return [kObs(y,0,1),kNth(y,0,1,3),kNth(y,1,1,3),kLast(y,4,1),kObs(y,5,19),kObs(y,6,4),kNth(y,8,1,1),kNth(y,9,1,2),kObs(y,10,11),kNth(y,10,4,4),kObs(y,11,25),kObs(y+1,0,1)];}
function kBiz(s){var d=new Date(s+'T12:00:00');return d.getDay()!==0&&d.getDay()!==6&&kHol(d.getFullYear()).indexOf(s)<0;}
function kBack(s,n){while(!kBiz(s))s=kAdd(s,-1);while(n>0){s=kAdd(s,-1);if(kBiz(s))n--;}return s;}
function kPer(end){var d=new Date(end+'T12:00:00'),y=d.getFullYear(),m=d.getMonth();
  if(d.getDate()===10)return {start:ymd(new Date(y,m-1,26,12)),end:end,pay:ymd(new Date(y,m,15,12))};
  return {start:ymd(new Date(y,m,11,12)),end:end,pay:ymd(new Date(y,m+1,0,12))};}
function kNextEnd(end){var d=new Date(end+'T12:00:00');return d.getDate()===10?ymd(new Date(d.getFullYear(),d.getMonth(),25,12)):ymd(new Date(d.getFullYear(),d.getMonth()+1,10,12));}
function kPrevEnd(end){var d=new Date(end+'T12:00:00');return d.getDate()===25?ymd(new Date(d.getFullYear(),d.getMonth(),10,12)):ymd(new Date(d.getFullYear(),d.getMonth()-1,25,12));}
function kDays(n){return n===0?'today':n===1?'tomorrow':'in '+n+' days';}
function kDiff(a,b){return Math.round((new Date(b+'T12:00:00')-new Date(a+'T12:00:00'))/864e5);}
function payLoad(){if(KPAY!==null||KPAY_BUSY||!owner())return;KPAY_BUSY=true;rpc('crew_pay',{p_token:TOKEN,p_done:null}).then(function(r){KPAY=(r&&r.done)||'';KPAY_BUSY=false;render();}).catch(function(){KPAY_BUSY=false;KPAY='';});}
function payMark(end,undo){rpc('crew_pay',{p_token:TOKEN,p_done:end}).then(function(r){KPAY=(r&&r.done)||'';render();toast(undo?'Put back':'Marked done. Showing the next pay period.');}).catch(function(e){if(e.message!=='Signed out')alert(e.message);});}
function payCard(){
  if(!owner())return '';payLoad();if(KPAY===null)return '';
  var t=ymd(new Date()),d=new Date(t+'T12:00:00'),day=d.getDate(),y=d.getFullYear(),m=d.getMonth();
  var curEnd=day<=10?ymd(new Date(y,m,10,12)):day<=25?ymd(new Date(y,m,25,12)):ymd(new Date(y,m+1,10,12));
  var end=/^\d{4}-\d\d-\d\d$/.test(KPAY)?kNextEnd(KPAY):kPrevEnd(curEnd);
  if(end<kPrevEnd(curEnd))end=(kDiff(kPer(kPrevEnd(curEnd)).pay,t)<=5)?kPrevEnd(curEnd):curEnd;
  var p=kPer(end),payOn=kBack(p.pay,0),due=kBack(payOn,2),ended=t>p.end,toDue=kDiff(t,due),late=toDue<0,hot=toDue<=0;
  var un=0;done().forEach(function(e){var s=ymd(e.start_at);if(s>=p.start&&s<=p.end&&!e.paid_at)un+=hrs(e);});
  var head=late?'OnPay payroll is past due':toDue===0?'OnPay payroll is due today':ended||toDue<=2?'Time to run OnPay payroll':'Payroll';
  var warn=ended||toDue<=2,col=hot?'red':'amb';
  return '<div class="card"'+(warn?' style="border-color:var(--'+col+');background:'+(hot?'#fdecec':'var(--amb2)')+'"':'')+'><b'+(warn?' style="color:var(--'+col+')"':'')+'>'+head+'</b><div class="sm" style="margin:4px 0 8px">'+esc(S.who)+'\'s pay period '+dlbl(p.start)+' – '+dlbl(p.end)+(ended?' has ended.':' ends '+kDays(kDiff(t,p.end))+'.')+' Run OnPay by about '+dlbl(due)+(late?' (that was '+(-toDue)+' day'+(toDue===-1?'':'s')+' ago)':' ('+kDays(toDue)+')')+' for the '+dlbl(payOn)+' payday. '+f2(un)+' h in this period not marked paid yet.</div>'+
    '<button class="b'+(warn?'':' alt')+'" style="margin:0" onclick="payMark(\''+p.end+'\')">Payroll for this period is done</button>'+
    (KPAY?'<div class="mut sm" style="margin-top:8px">Last marked done: period ending '+dlbl(KPAY)+' · <a href="#" onclick="payMark(\''+kPrevEnd(KPAY)+'\',true);return false">undo</a></div>':'')+
    '<div class="mut sm" style="margin-top:4px">Only you see this. The run-by date assumes OnPay needs 2 business days; OnPay shows the exact cutoff.</div></div>';
}

  var lgn=S.logins||[];

    '<div class="sm">Last opened the hub: <b>'+(S.last_seen?dlbl(ymd(S.last_seen))+' '+tm(S.last_seen):'not yet')+'</b></div>'+
    (lgn.length?'<div class="mut sm" style="margin:8px 0 2px">Signed in with his code:</div>'+lgn.slice(0,12).map(function(t){return '<div class="row" style="padding:6px 0"><div class="f">'+dlbl(ymd(t))+'</div><div class="n" style="font-weight:500">'+tm(t)+'</div></div>';}).join('')+(lgn.length>12?'<div class="mut sm">and '+(lgn.length-12)+' earlier</div>':'')

    '<div class="mut sm" style="margin-top:8px">A phone stays signed in, so sign-ins are rare. "Last opened" is the better sign he is using it.</div></div>';

    '<button class="b" onclick="doPay(true)">Mark paid</button>'+(any?'<button class="b alt" onclick="doPay(false)">Set back to not paid</button>':'')+'<button class="b ghost" onclick="closeSheet()">Cancel</button>');}
function doPay(on){var ids=picked().map(function(e){return e.id;});if(on&&!$('pd').value)return alert('Pick the date');
  act('crew_mark_paid',{p_token:TOKEN,p_ids:ids,p_date:on?$('pd').value:null,p_ref:on?$('pr').value:null},function(){SEL={};closeSheet();render();toast(on?'Marked paid':'Set back to not paid');});}
function rbForm(){var p=picked().filter(function(e){return e.reimburse;}),h=p.reduce(function(a,e){return a+hrs(e);},0),any=p.some(function(e){return e.reimbursed_at;});
  sheet('<h3>Paid back to me</h3><div class="mut sm">By Deal Ag or Yield Advantage, for Kevin\'s time.</div><div>'+p.length+' entries · <b>'+f2(h)+' hours</b></div><label>Date</label><input id="pd" type="date" value="'+ymd(new Date())+'"><label>Reference (invoice, check…)</label><input id="pr" placeholder="optional">'+
    '<button class="b" onclick="doRb(true)">Mark paid back</button>'+(any?'<button class="b alt" onclick="doRb(false)">Set back to owed</button>':'')+'<button class="b ghost" onclick="closeSheet()">Cancel</button>');}
function doRb(on){var ids=picked().filter(function(e){return e.reimburse;}).map(function(e){return e.id;});if(on&&!$('pd').value)return alert('Pick the date');
  act('crew_mark_reimbursed',{p_token:TOKEN,p_ids:ids,p_date:on?$('pd').value:null,p_ref:on?$('pr').value:null},function(){SEL={};closeSheet();render();toast('Saved');});}
function setCode(){var c=$('kc').value.trim();if(!/^\d{4}$/.test(c))return alert('Enter 4 digits');if(!confirm('Set the sign-in code to '+c+'? Any phone already signed in with the old code is signed out.'))return;
  act('crew_set_code',{p_token:TOKEN,p_code:c},function(){toast('Code saved');});}
function csv(){
  var q=function(v){v=String(v==null?'':v);return /[",\n]/.test(v)?'"'+v.replace(/"/g,'""')+'"':v;};
  var rows=[['Date','Start','End','Hours','Work','YA job','Notes','Paid on','Paid how','Paid back to Josh','Paid back on','Source']];
  done().slice().reverse().forEach(function(e){rows.push([ymd(e.start_at),e.source==='import'?'':tm(e.start_at),e.source==='import'?'':tm(e.end_at),f2(hrs(e)),e.kind==='ya'?'Yield Advantage':e.kind==='dealag'?'Deal Ag (Justin)':'Farm',e.job||e.task||'',e.note||'',e.paid_at||'',e.paid_ref||'',e.reimburse?'yes':'',e.reimbursed_at||'',e.source]);});
  var a=document.createElement('a');a.href=URL.createObjectURL(new Blob([rows.map(function(r){return r.map(q).join(',');}).join('\n')],{type:'text/csv'}));a.download=S.who+' hours ledger '+ymd(new Date())+'.csv';document.body.appendChild(a);a.click();a.remove();
}

function checkVersion(){fetch('kevin.html?nocache='+Date.now(),{cache:'no-store'}).then(function(r){return r.text();}).then(function(t){var m=/var VERSION = (\d+);/.exec(t);if(m&&+m[1]>VERSION&&$('sheet').style.display!=='flex')location.replace('kevin.html?v='+m[1]);}).catch(function(){});}
checkVersion();document.addEventListener('visibilitychange',function(){if(!document.hidden)checkVersion();});
TOKEN=load('kvToken');if(TOKEN)boot();else padView();
</script>
