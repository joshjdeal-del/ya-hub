<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="YA Hub">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="theme-color" content="#2f6b2f">
<link rel="manifest" href="manifest.json">
<link rel="apple-touch-icon" href="icon-192.png">
<title>YA Hub</title>
<style>
:root{--g:#2f6b2f;--g2:#e8f1e6;--g3:#cfe3ca;--ink:#1d2a1d;--mut:#6b766b;--line:#dde3da;--bg:#f5f7f3;--red:#a33;--red2:#f7e4e4;--amb:#a8680f;--amb2:#fdf1dc;--blue:#245a8d;--blue2:#e3eef8;--card:#fff}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.4 -apple-system,system-ui,"Segoe UI",Roboto,sans-serif}
header{position:sticky;top:0;z-index:5;background:var(--g);color:#fff;padding:calc(env(safe-area-inset-top) + 10px) 16px 10px;display:flex;align-items:center;justify-content:space-between;gap:8px}
header b{font-size:18px;letter-spacing:.01em}
header .who{font-size:14px;opacity:.9;display:flex;gap:8px;align-items:center}
header button{background:transparent;border:1px solid #ffffff88;color:#fff;border-radius:8px;padding:5px 9px;font-size:13px}
main{max-width:760px;margin:0 auto;padding:12px 16px calc(84px + env(safe-area-inset-bottom))}
nav{position:fixed;left:0;right:0;bottom:0;z-index:6;background:#fff;border-top:1px solid var(--line);display:flex;justify-content:space-around;padding:6px 4px calc(6px + env(safe-area-inset-bottom))}
nav button{flex:1;background:none;border:0;color:var(--mut);font-size:11px;padding:4px 0;display:flex;flex-direction:column;align-items:center;gap:2px;position:relative}
nav button svg{width:24px;height:24px}
nav button.on{color:var(--g);font-weight:600}
nav .dot{position:absolute;top:0;right:calc(50% - 20px);background:var(--red);color:#fff;border-radius:999px;font-size:10px;min-width:16px;height:16px;line-height:16px;padding:0 4px}
.card{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:14px;margin:0 0 12px}
h2{font-size:13px;margin:0 0 10px;color:var(--mut);text-transform:uppercase;letter-spacing:.05em;display:flex;justify-content:space-between;align-items:center;gap:8px}
h3{font-size:17px;margin:0 0 6px}
.big{font-size:34px;font-weight:700;font-variant-numeric:tabular-nums}
.mut{color:var(--mut);font-size:14px}.sm{font-size:13px}
.b{display:block;width:100%;padding:13px;border:0;border-radius:12px;font-size:16px;font-weight:600;background:var(--g);color:#fff;margin-top:8px}
.b.alt{background:var(--g2);color:var(--g)}.b.red{background:var(--red)}.b.ghost{background:#fff;border:1px solid var(--line);color:var(--ink)}
.s{padding:6px 10px;border:1px solid var(--line);background:#fff;border-radius:8px;font-size:14px;color:var(--ink)}
.s.pri{background:var(--g);border-color:var(--g);color:#fff}
select,input,textarea{width:100%;padding:10px 11px;border:1px solid var(--line);border-radius:10px;font-size:16px;background:#fff;font-family:inherit;margin-top:5px;color:var(--ink)}
textarea{min-height:64px;resize:vertical}
label{display:block;font-size:13px;color:var(--mut);margin-top:10px}
.row{display:flex;gap:8px;align-items:center}.row>.f{flex:1;min-width:0}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:8px}
table{width:100%;border-collapse:collapse;font-size:14px}
td,th{padding:6px 4px;border-bottom:1px solid var(--line);text-align:left;vertical-align:top}
th{color:var(--mut);font-weight:600;font-size:12px}
.n{text-align:right;white-space:nowrap;font-variant-numeric:tabular-nums}
.pill{display:inline-block;font-size:12px;padding:2px 8px;border-radius:999px;background:var(--g2);color:var(--g);white-space:nowrap}
.pill.amb{background:var(--amb2);color:var(--amb)}.pill.red{background:var(--red2);color:var(--red)}.pill.blue{background:var(--blue2);color:var(--blue)}.pill.gray{background:#eee;color:#555}
.list>*{padding:10px 0;border-bottom:1px solid var(--line)}.list>*:last-child{border-bottom:0}
.tap{cursor:pointer}
.flag{color:var(--amb);font-size:13px}
.tabs{display:flex;gap:6px;overflow-x:auto;margin:0 0 12px;padding-bottom:2px;scrollbar-width:none}
.tabs button{flex:0 0 auto;padding:7px 12px;border-radius:999px;border:1px solid var(--line);background:#fff;font-size:14px;color:var(--ink)}
.tabs button.on{background:var(--g);color:#fff;border-color:var(--g)}
.bar{height:8px;background:#eee;border-radius:99px;overflow:hidden;margin-top:6px}.bar i{display:block;height:100%;background:var(--g)}.bar i.over{background:var(--red)}
.pad{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;max-width:290px;margin:16px auto}
.pad button{padding:17px 0;font-size:24px;border-radius:14px;border:1px solid var(--line);background:#fff;color:var(--ink)}
.dots{display:flex;justify-content:center;gap:14px;margin:22px 0 6px}
.dots i{width:16px;height:16px;border-radius:50%;border:2px solid var(--g)}.dots i.f{background:var(--g)}
.err{color:var(--red);text-align:center;min-height:20px;font-size:14px}
.msg{margin:8px 0;max-width:85%}.msg .bub{background:#fff;border:1px solid var(--line);border-radius:14px;padding:8px 11px;white-space:pre-wrap;word-wrap:break-word}
.msg.me{margin-left:auto}.msg.me .bub{background:var(--g2);border-color:var(--g3)}
.msg .meta{font-size:11px;color:var(--mut);margin:2px 4px}
.chk{width:24px;height:24px;border-radius:7px;border:2px solid var(--g);flex:0 0 24px;display:flex;align-items:center;justify-content:center;color:#fff;font-size:15px;background:#fff}
.chk.on{background:var(--g)}
.done-t{text-decoration:line-through;color:var(--mut)}
#busy{position:fixed;inset:0;background:#0001;display:none;align-items:center;justify-content:center;z-index:20}
#busy div{background:#fff;padding:12px 16px;border-radius:12px;box-shadow:0 4px 20px #0002}
#sheet{position:fixed;inset:0;background:#0006;display:none;align-items:flex-end;justify-content:center;z-index:15}
#sheet .in{background:#fff;width:100%;max-width:760px;max-height:92vh;overflow:auto;border-radius:16px 16px 0 0;padding:16px 16px calc(18px + env(safe-area-inset-bottom))}
#toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(90px + env(safe-area-inset-bottom));background:#222;color:#fff;padding:9px 14px;border-radius:10px;font-size:14px;display:none;z-index:30;max-width:90%}
.search{position:relative}.search input{padding-left:34px}.search svg{position:absolute;left:10px;top:15px;width:18px;height:18px;color:var(--mut)}
.right{text-align:right}.hide{display:none}
</style>
</head>
<body>
<header><b>YA Hub</b><div class="who" id="who"></div></header>
<main id="app"></main>
<nav id="nav" class="hide"></nav>
<div id="busy"><div>Working…</div></div>
<div id="sheet"><div class="in" id="sheetIn"></div></div>
<div id="toast"></div>
<script>
/* ===== connection ===== */
var SB = 'https://ozjlcmyheosczikxnfxk.supabase.co';
var KEY = 'sb_publishable_qFb_Fu730Wqx8mtmtA_Yyg_rNzCuY3h';
var TZ = 'America/Chicago', ANCHOR = '2026-10-05';

var TOKEN = '', S = null, TAB = 'clock', SUB = {}, PER = null, LASTPING = null, THREAD = null;
function $(id){return document.getElementById(id);}
function esc(s){return String(s==null?'':s).replace(/[&<>"']/g,function(c){return{'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c];});}
function store(k,v){try{if(v==null)localStorage.removeItem(k);else localStorage.setItem(k,v);}catch(e){}}
function load(k){try{return localStorage.getItem(k);}catch(e){return null;}}
function toast(t){var d=$('toast');d.textContent=t;d.style.display='block';clearTimeout(toast.t);toast.t=setTimeout(function(){d.style.display='none';},2600);}
function busy(on){$('busy').style.display=on?'flex':'none';}

function rpc(fn,args,quiet){
  if(!quiet)busy(true);
  return fetch(SB+'/rest/v1/rpc/'+fn,{method:'POST',headers:{'apikey':KEY,'Authorization':'Bearer '+KEY,'Content-Type':'application/json'},body:JSON.stringify(args||{})})
    .then(function(r){return r.json().catch(function(){return null;}).then(function(j){
      if(!quiet)busy(false);
      if(!r.ok){var m=(j&&(j.message||j.hint))||('Error '+r.status);if(m==='signin'){signOut(true);throw new Error('Signed out');}throw new Error(m);}
      return j;});})
    .catch(function(e){if(!quiet)busy(false);throw e;});
}
function act(fn,args,after){return rpc(fn,args).then(function(r){return refresh().then(function(){if(after)after(r);});}).catch(function(e){if(e.message!=='Signed out')alert(e.message);});}

/* ===== dates ===== */
function ymd(d){return new Date(d).toLocaleDateString('en-CA',{timeZone:TZ});}
function today(){return ymd(Date.now());}
function addDays(s,n){var p=s.split('-');var d=new Date(Date.UTC(+p[0],+p[1]-1,+p[2]+n));return d.toISOString().slice(0,10);}
function diffDays(a,b){var pa=a.split('-'),pb=b.split('-');return Math.round((Date.UTC(+pb[0],+pb[1]-1,+pb[2])-Date.UTC(+pa[0],+pa[1]-1,+pa[2]))/864e5);}
function periodOf(s){var n=Math.floor(diffDays(ANCHOR,s)/14);var st=addDays(ANCHOR,n*14);return {start:st,end:addDays(st,13)};}
function dow(s){return new Date(s+'T12:00:00Z').getUTCDay();}
function dlbl(s){return new Date(s+'T12:00:00Z').toLocaleDateString('en-US',{weekday:'short',month:'numeric',day:'numeric',timeZone:'UTC'});}
function tm(iso){return new Date(iso).toLocaleTimeString('en-US',{hour:'numeric',minute:'2-digit',timeZone:TZ});}
function hhmm(iso){return new Date(iso).toLocaleTimeString('en-GB',{hour:'2-digit',minute:'2-digit',timeZone:TZ});}
function hrs(a,b){return Math.max(0,(new Date(b||Date.now())-new Date(a))/36e5);}
function f2(x){return (Math.round((+x||0)*100)/100).toFixed(2);}
function hm(h){var s=Math.max(0,Math.round(h*3600)),H=Math.floor(s/3600),M=Math.floor(s%3600/60);return H+'h '+(M<10?'0':'')+M+'m';}
function money(x){return '$'+(+x||0).toLocaleString('en-US',{minimumFractionDigits:2,maximumFractionDigits:2});}
function localIso(d,t){return new Date(d+'T'+t+':00').toISOString();}
function ago(iso){var m=Math.round((Date.now()-new Date(iso))/6e4);if(m<1)return 'now';if(m<60)return m+'m';if(m<1440)return Math.round(m/60)+'h';return dlbl(ymd(iso));}

/* ===== lookups ===== */
function mgr(){return S&&(S.me.role==='admin'||S.me.role==='partner');}
function admin(){return S&&S.me.role==='admin';}
function rate(){return (S.settings.labor_rate&&+S.settings.labor_rate.default)||0;}
function jobQuotes(id){return (S.quotes||[]).filter(function(q){return q.job_id===id&&(q.status==='accepted'||q.status==='sent');});}
function billables(j){
  var out=[],fixed=j.labor_mode==='fixed',r=rate();
  jobQuotes(j.id).forEach(function(q){(q.lines||[]).forEach(function(l){
    if(l.kind==='labor'&&!fixed)return;
    out.push({t:'line',id:l.id,label:(l.kind==='labor'?'Quoted labor: ':'')+((+l.qty!==1&&l.kind!=='labor')?n0(l.qty)+' × ':'')+(l.description||''),sub:l.kind==='labor'?n0(l.qty)+' h quoted, fixed price':(l.item_code?'#'+l.item_code:''),amt:(+l.qty||0)*(+l.unit_price||0),ref:l.billed_at?(l.billed_ref||'billed'):'',ok:true});});});
  jobChanges(j.id).forEach(function(c){
    var amt=(+c.qty||0)*(+c.unit_price||0);
    if(amt||!(+c.add_hours))out.push({t:'chg',id:c.id,label:'Extra: '+n0(c.qty)+' × '+c.description,sub:amt?'change order':'change order, needs a price',amt:amt,ref:c.billed_at?(c.billed_ref||'billed'):'',ok:!!c.customer_ok,noprice:!amt});
    if(fixed&&+c.add_hours)out.push({t:'chgl',id:c.id,label:'Extra labor: '+c.description,sub:f2(c.add_hours)+' h × '+money(r),amt:Math.round((+c.add_hours)*r*100)/100,ref:c.labor_billed_at?(c.labor_billed_ref||'billed'):'',ok:!!c.customer_ok});
  });
  if(!fixed)S.entries.forEach(function(e){if(e.job_id!==j.id||!e.billable||!e.end_at)return;var h=hrs(e.start_at,e.end_at);
    out.push({t:'ent',id:e.id,label:'Labor: '+person(e.person_id).name+' '+dlbl(ymd(e.start_at)),sub:f2(h)+' h × '+money(r)+(e.note?' · '+e.note:''),amt:Math.round(h*r*100)/100,ref:e.billed_at?(e.billed_ref||'billed'):'',ok:true,at:e.end_at});});
  return out;
}
function billSum(j){var b=mgr()?billables(j):[],ready=0,billed=0,hold=0;b.forEach(function(x){if(x.ref)billed+=x.amt;else if(x.ok)ready+=x.amt;else hold+=x.amt;});return {items:b,ready:ready,billed:billed,hold:hold};}
function setView(m){rpc('set_view',{p_token:TOKEN,p_mode:m}).then(function(){closeSheet();SUB={};return refresh();}).then(function(){toast(m?'Showing the employee view':'Back to the owner view');}).catch(function(e){alert(e.message);});}
function person(id){return (S.people||[]).filter(function(p){return p.id===id;})[0]||{name:'?'};}
function job(id){return (S.jobs||[]).filter(function(j){return j.id===id;})[0]||null;}
function cust(id){return (S.customers||[]).filter(function(c){return c.id===id;})[0]||null;}
function jobName(j){if(!j)return 'No job';return (j.customer?j.customer+' · ':'')+j.name;}
function isFarm(j){return j&&!j.customer_id&&j.kind==='Farm work';}
function farmEntity(j){var i=j.name.indexOf(' · ');return i>0?j.name.slice(0,i):'Other';}
function farmType(j){var i=j.name.indexOf(' · ');return i>0?j.name.slice(i+3):j.name;}
function farmEntities(){var m={};(S.jobs||[]).forEach(function(j){if(isFarm(j))m[farmEntity(j)]=1;});return Object.keys(m).sort();}
function billGroup(j){return j&&j.customer?j.customer:(isFarm(j)?farmEntity(j)+' (farm work)':'No customer');}
function jobById(id){return jobName(job(id));}
function running(pid){return (S.entries||[]).filter(function(e){return !e.end_at&&e.person_id===(pid||S.me.id);})[0]||null;}
function openJobs(){return (S.jobs||[]).filter(function(j){return j.status==='open';});}

/* ===== location ===== */
function where(){
  return new Promise(function(res){
    if(!navigator.geolocation)return res({lat:null,lng:null,acc:null});
    var done=false;var t=setTimeout(function(){if(!done){done=true;res({lat:null,lng:null,acc:null});}},9000);
    navigator.geolocation.getCurrentPosition(function(p){if(done)return;done=true;clearTimeout(t);res({lat:p.coords.latitude,lng:p.coords.longitude,acc:Math.round(p.coords.accuracy)});},
      function(){if(done)return;done=true;clearTimeout(t);res({lat:null,lng:null,acc:null});},{enableHighAccuracy:true,timeout:8500,maximumAge:60000});
  });
}
function distM(a,b,c,d){var R=6371000,r=Math.PI/180,x=(c-a)*r,y=(d-b)*r;var h=Math.sin(x/2)*Math.sin(x/2)+Math.cos(a*r)*Math.cos(c*r)*Math.sin(y/2)*Math.sin(y/2);return 2*R*Math.asin(Math.sqrt(h));}
function places(){var p=(S.settings&&S.settings.places)||[];if(!p.length&&S.settings&&S.settings.shop&&S.settings.shop.lat!=null)p=[{name:'shop',lat:S.settings.shop.lat,lng:S.settings.shop.lng}];return p;}
function locTag(lat,lng,acc){
  if(lat==null)return '<span class="pill gray">no location</span>';
  var ps=places(),fence=+(S.settings&&S.settings.geofence_m)||1600,txt='map',cls='pill blue',best=null;
  ps.forEach(function(p){var d=distM(p.lat,p.lng,lat,lng);if(!best||d<best.d)best={d:d,name:p.name};});
  if(best){if(best.d<=fence){txt='at '+best.name;cls='pill';}else{txt=(best.d/1609.34).toFixed(1)+' mi from '+best.name;cls='pill amb';}}
  return '<a class="'+cls+'" target="_blank" href="https://maps.google.com/?q='+lat+','+lng+'">'+esc(txt)+'</a>';
}

/* ===== sign in ===== */
var typed='';
function padView(msg){
  $('who').innerHTML='';$('nav').className='hide';
  var k=[1,2,3,4,5,6,7,8,9,'',0,'⌫'];
  $('app').innerHTML='<div class="card" style="text-align:center;margin-top:20px"><h3>Yield Advantage</h3><div class="mut">Enter your 4-digit code</div>'+
    '<div class="dots">'+[0,1,2,3].map(function(i){return '<i class="'+(i<typed.length?'f':'')+'"></i>';}).join('')+'</div>'+
    '<div class="err">'+esc(msg||'')+'</div><div class="pad">'+
    k.map(function(x){return x===''?'<span></span>':'<button onclick="key(\''+x+'\')">'+x+'</button>';}).join('')+'</div></div>';
}
function key(x){
  if(x==='⌫'){typed=typed.slice(0,-1);padView();return;}
  if(typed.length>=4)return;typed+=x;padView();
  if(typed.length===4){var c=typed;typed='';
    rpc('login',{p_code:c}).then(function(r){if(!r.ok){padView(r.why);return;}TOKEN=r.token;store('yaToken',TOKEN);boot();}).catch(function(e){padView(e.message);});}
}
function signOut(silent){if(TOKEN&&!silent)rpc('logout',{p_token:TOKEN},true).catch(function(){});TOKEN='';S=null;store('yaToken',null);clearInterval(boot.t);padView(silent?'Signed out — enter your code':'');}

/* ===== data ===== */
function range(){
  var p=PER||periodOf(today());
  var from=addDays(p.start,-14); if(from>addDays(today(),-21))from=addDays(today(),-21);
  return {from:from,to:addDays(p.end,0)>today()?addDays(p.end,0):today()};
}
function refresh(quiet){var r=range();return rpc('state',{p_token:TOKEN,p_from:r.from,p_to:r.to},quiet).then(function(st){S=st;render();});}
function boot(){
  refresh().then(function(){
    clearInterval(boot.t);
    boot.t=setInterval(function(){if(document.hidden||!TOKEN)return;
      rpc('ping',{p_token:TOKEN},true).then(function(p){var sig=p.last_message+'|'+p.pending+'|'+p.changed;var ae=document.activeElement;var typing=ae&&/INPUT|TEXTAREA|SELECT/.test(ae.tagName);if(LASTPING&&sig!==LASTPING&&!typing&&!$('sheet').style.display.match(/flex/))refresh(true);if(typing&&sig!==LASTPING)return;LASTPING=sig;}).catch(function(){});
    },20000);
  }).catch(function(e){if(e.message!=='Signed out')padView(e.message);});
}
document.addEventListener('visibilitychange',function(){if(!document.hidden&&TOKEN&&S)refresh(true).catch(function(){});});

/* ===== shell ===== */
var ICON={
 clock:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="9"/><path d="M12 7v5l3 2"/></svg>',
 tasks:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M9 6h11M9 12h11M9 18h11"/><path d="M4 6l1 1 2-2M4 12l1 1 2-2M4 18l1 1 2-2"/></svg>',
 jobs:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="3" y="7" width="18" height="13" rx="2"/><path d="M8 7V5a2 2 0 012-2h4a2 2 0 012 2v2"/></svg>',
 msgs:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M4 5h16v11H8l-4 4z"/></svg>',
 team:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="9" cy="8" r="3"/><path d="M3 20c0-3 3-5 6-5s6 2 6 5"/><circle cx="17" cy="9" r="2.5"/><path d="M15 15c3 0 6 1.5 6 4"/></svg>',
 me:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M4 19V5M4 19h16M8 15v-4M12 15V8M16 15v-6"/></svg>'
};
function unreadCount(){var n=0;threads().forEach(function(t){n+=t.unread;});return n;}
function render(){
  if(!S)return;
  var real=S.me.real||S.me.role,canView=real==='admin'||real==='partner';
  $('who').innerHTML=esc(S.me.name)+(canView&&!S.me.viewing?' <button onclick="setView(\'employee\')">Employee view</button>':'')+' <button onclick="signOut()">Sign out</button>';
  if(TAB==='team'&&!mgr())TAB='clock';if(TAB==='me'&&mgr())TAB='team';
  if(!mgr()&&(SUB.jf==='quotes'||SUB.jf==='bill'))SUB.jf='open';
  var tabs=[['clock','Clock'],['tasks','Tasks'],['jobs','Jobs'],['msgs','Messages']];
  tabs.push(mgr()?['team','Team']:['me','My hours']);
  var un=unreadCount(),pend=mgr()?S.requests.filter(function(r){return r.status==='pending';}).length:0;
  $('nav').className='';
  $('nav').innerHTML=tabs.map(function(t){var dot=(t[0]==='msgs'&&un)?'<span class="dot">'+un+'</span>':(t[0]==='team'&&pend)?'<span class="dot">'+pend+'</span>':'';
    return '<button class="'+(TAB===t[0]?'on':'')+'" onclick="go(\''+t[0]+'\')">'+ICON[t[0]]+t[1]+dot+'</button>';}).join('');
  var f={clock:vClock,tasks:vTasks,jobs:vJobs,msgs:vMsgs,team:vTeam,me:vMe}[TAB]||vClock;

/* ===== MESSAGES ===== */
function threads(){
  var map={},rd=S.reads||{};
  map.general={key:'general',job_id:null,name:'Yield Advantage — everyone',last:null,unread:0};
  (S.messages||[]).forEach(function(m){var k=m.job_id||'general';
    if(!map[k])map[k]={key:k,job_id:m.job_id,name:jobById(m.job_id),last:null,unread:0};
    map[k].last=m;if(m.person_id!==S.me.id&&(!rd[k]||m.at>rd[k]))map[k].unread++;});
  return Object.keys(map).map(function(k){return map[k];}).sort(function(a,b){if(a.key==='general')return -1;if(b.key==='general')return 1;return (b.last?b.last.id:0)-(a.last?a.last.id:0);});
}

/* ===== HOURS (shared) ===== */
function summarize(pid,per){
  var days=[],by={};for(var i=0;i<14;i++){var k=addDays(per.start,i);var r={date:k,hours:0,first:null,leave:[],jobs:{}};days.push(r);by[k]=r;}
  var jobs={},bill=0;
  S.entries.forEach(function(e){if(e.person_id!==pid)return;var k=ymd(e.start_at);var r=by[k];if(!r)return;var h=hrs(e.start_at,e.end_at);r.hours+=h;
    if(!r.first||e.start_at<r.first)r.first=e.start_at;jobs[e.job_id]=(jobs[e.job_id]||0)+h;if(e.billable)bill+=h;});
  var leave={};S.requests.forEach(function(q){if(q.person_id!==pid||q.status!=='approved'||!by[q.day]||['Sick','PTO','Holiday','Unpaid'].indexOf(q.type)<0)return;by[q.day].leave.push(q);leave[q.type]=(leave[q.type]||0)+(+q.hours);});
  var weeks=[0,1].map(function(w){var t=0;for(var d=w*7;d<w*7+7;d++)t+=days[d].hours;var t2=Math.round(t*100)/100;return {start:days[w*7].date,end:days[w*7+6].date,hours:t2,reg:Math.min(40,t2),ot:Math.max(0,Math.round((t2-40)*100)/100)};});
  var firsts=days.filter(function(d){var w=dow(d.date);return d.first&&w>=1&&w<=5;}).map(function(d){var p=hhmm(d.first).split(':');return (+p[0])*60+(+p[1]);});
  var avg=firsts.length?firsts.reduce(function(a,b){return a+b;},0)/firsts.length:null;
  var flags=days.filter(function(d){var w=dow(d.date);return w>=1&&w<=5&&d.hours===0&&!d.leave.length&&d.date<today();}).map(function(d){return d.date;});
  return {days:days,weeks:weeks,worked:weeks[0].hours+weeks[1].hours,reg:weeks[0].reg+weeks[1].reg,ot:weeks[0].ot+weeks[1].ot,leave:leave,
    jobs:Object.keys(jobs).map(function(k){return {job_id:k,hours:jobs[k]};}).sort(function(a,b){return b.hours-a.hours;}),billable:bill,
    avg:avg==null?null:(Math.floor(avg/60)%12||12)+':'+('0'+Math.floor(avg%60)).slice(-2)+(avg<720?' AM':' PM'),flags:flags};
}
function perBar(){var p=PER||periodOf(today());return '<div class="row" style="margin-bottom:10px"><button class="s" onclick="shiftPer(-1)">◀</button><div class="f" style="text-align:center"><b>'+dlbl(p.start)+' – '+dlbl(p.end)+'</b></div><button class="s" onclick="shiftPer(1)">▶</button></div>';}
function shiftPer(n){var p=PER||periodOf(today());PER=periodOf(addDays(p.start,14*n));refresh();}
function hoursCard(pid,showName){
  var per=PER||periodOf(today()),m=summarize(pid,per);
  var lv=Object.keys(m.leave);
  return '<div class="card"><h2>'+(showName?esc(person(pid).name):'Hours')+'<span>'+f2(m.worked)+' h</span></h2>'+
    '<table><tr><th>Week</th><th class="n">Total</th><th class="n">Reg</th><th class="n">OT</th></tr>'+m.weeks.map(function(w){return '<tr><td>'+dlbl(w.start)+'</td><td class="n">'+f2(w.hours)+'</td><td class="n">'+f2(w.reg)+'</td><td class="n">'+f2(w.ot)+'</td></tr>';}).join('')+
    '<tr><td><b>Period</b></td><td class="n"><b>'+f2(m.worked)+'</b></td><td class="n"><b>'+f2(m.reg)+'</b></td><td class="n"><b>'+f2(m.ot)+'</b></td></tr></table>'+
    (lv.length?'<div class="mut sm" style="margin-top:6px">Time off: '+lv.map(function(t){return esc(t)+' '+f2(m.leave[t])+' h';}).join(' · ')+'</div>':'')+
    (m.jobs.length?'<table style="margin-top:10px"><tr><th>Job</th><th class="n">Hours</th></tr>'+m.jobs.map(function(x){var j=job(x.job_id);return '<tr><td>'+esc(jobName(j))+(j&&j.billable?' <span class="pill">$</span>':'')+'</td><td class="n">'+f2(x.hours)+'</td></tr>';}).join('')+'</table>':'')+
    '<div class="mut sm" style="margin-top:6px">Billable '+f2(m.billable)+' h'+(m.avg?' · avg weekday start '+m.avg:'')+'</div>'+
    (m.flags.length?'<div style="margin-top:6px">'+m.flags.map(function(d){return '<div class="flag">⚠ '+dlbl(d)+': weekday with no hours or time off</div>';}).join('')+'</div>':'')+
    '<details style="margin-top:8px"><summary class="mut sm">Day by day</summary><table>'+m.days.map(function(d){return '<tr><td>'+dlbl(d.date)+'</td><td>'+(d.first?tm(d.first):'')+'</td><td class="n">'+(d.hours?f2(d.hours):'')+'</td><td class="sm">'+d.leave.map(function(l){return esc(l.type)+' '+f2(l.hours);}).join(', ')+'</td></tr>';}).join('')+'</table></details></div>';
}
function vMe(){
  var per=PER||periodOf(today());
  var es=S.entries.filter(function(e){return e.person_id===S.me.id&&ymd(e.start_at)>=per.start&&ymd(e.start_at)<=per.end;}).slice().reverse();
  return perBar()+hoursCard(S.me.id,false)+'<div class="card"><h2>Entries</h2>'+(es.length?'<div class="list">'+es.map(function(e){return '<div class="tap" onclick="entryTap(\''+e.id+'\')"><div class="row"><div class="f"><b>'+esc(jobById(e.job_id))+'</b></div><div class="n">'+(e.end_at?f2(hrs(e.start_at,e.end_at)):'running')+'</div></div><div class="mut sm">'+dlbl(ymd(e.start_at))+' · '+tm(e.start_at)+' – '+(e.end_at?tm(e.end_at):'now')+(e.note?' · '+esc(e.note):'')+'</div></div>';}).join('')+'</div>':'<div class="mut">None</div>')+'</div>';
}

/* ===== TEAM (managers) ===== */
function vTeam(){

    ({now:tNow,feed:tFeed,hours:tHours,entries:tEntries,req:tReq,bill:tBill,ppl:tPeople}[f]||tNow)();
}
function attention(){
  var a=[];S.jobs.forEach(function(j){if(j.status==='archived')return;var s=billSum(j);
    if(j.status==='done'&&s.ready>0)a.push({j:j.id,cls:'',t:'Finished: '+money(s.ready)+' ready to bill'});
    var q=(+j.quoted_hours||0)+coHours(j.id),sp=+j.spent_hours||0;
    if(j.status==='open'&&q&&sp>=q*0.9)a.push({j:j.id,cls:sp>q?'red':'amb',t:sp>q?f2(sp-q)+' h over the quoted '+f2(q)+' h':Math.round(sp/q*100)+'% of quoted hours used ('+f2(sp)+' of '+f2(q)+')'});
    jobChanges(j.id).forEach(function(c){if(c.billed_at)return;
      if(!c.customer_ok)a.push({j:j.id,cls:'amb',t:'Change order not approved by the customer: '+c.description});

    var old=s.items.filter(function(x){return x.t==='ent'&&!x.ref&&x.at&&(Date.now()-new Date(x.at))>30*864e5;});
    if(old.length)a.push({j:j.id,cls:'amb',t:old.length+(old.length>1?' labor entries':' labor entry')+' unbilled over 30 days ('+money(old.reduce(function(p,x){return p+x.amt;},0))+')'});

function tFeed(){

function staff(){return S.people.filter(function(p){return p.active&&p.role==='employee';});}
function tNow(){

    '<div class="mut sm">since '+tm(e.start_at)+(ymd(e.start_at)!==today()?' ('+dlbl(ymd(e.start_at))+')':'')+' · '+hm(hrs(e.start_at))+(e.note?' · '+esc(e.note):'')+'</div>'+(hrs(e.start_at)>12?'<div class="flag">⚠ Running over 12 hours</div>':'')+

      '<div><div class="big" style="font-size:28px">'+f2(wk.hours)+'</div><div class="mut sm">this week'+(wk.ot?' · '+f2(wk.ot)+' OT':'')+'<br>'+dlbl(wk.start).replace(/^\w+, /,'')+'–'+dlbl(wk.end).replace(/^\w+, /,'')+'</div></div>'+
      '<div><div class="big" style="font-size:28px">'+f2(m.worked)+'</div><div class="mut sm">pay period<br>'+dlbl(cp.start).replace(/^\w+, /,'')+'–'+dlbl(cp.end).replace(/^\w+, /,'')+'</div></div></div>'+
      (first?'<div class="mut sm" style="margin-top:6px">Clocked in: '+locTag(first.in_lat,first.in_lng,first.in_acc)+'</div>':'')+
      (m.flags.length?'<div style="margin-top:6px">'+m.flags.map(function(d){return '<div class="flag">⚠ '+dlbl(d)+': no hours or time off</div>';}).join('')+'</div>':'')+'</div>';});
  var pend=S.requests.filter(function(r){return r.status==='pending';});
  if(pend.length)h+='<div class="card tap" onclick="SUB.mf=\'req\';render()"><h2>Waiting on you <span class="pill red">'+pend.length+'</span></h2><div class="mut sm">Time off and fix requests</div></div>';

function tHours(){var h=perBar();staff().forEach(function(p){h+=hoursCard(p.id,true);});

function tEntries(){

function entryForm(id){
  var e=id?S.entries.filter(function(x){return x.id===id;})[0]:{person_id:staff()[0]?staff()[0].id:S.me.id,job_id:'',start_at:null,end_at:null,note:'',billable:false};

    '<label>Date</label><input type="date" id="ed" value="'+d+'"><div class="grid2"><div><label>Start</label><input type="time" id="es" value="'+(e.start_at?hhmm(e.start_at):'08:00')+'"></div><div><label>End (blank = running)</label><input type="time" id="ee" value="'+(e.end_at?hhmm(e.end_at):(id?'':'17:00'))+'"></div></div>'+
    '<label>Job</label><select id="ej">'+jobOptions(e.job_id,true)+'</select><label><input type="checkbox" id="eb" style="width:auto" '+(e.billable?'checked':'')+'> Billable</label><label>Note</label><textarea id="en">'+esc(e.note||'')+'</textarea>'+
    (id&&!e.end_at?'<button class="b red" onclick="$(\'ee\').value=\''+hhmm(new Date().toISOString())+'\';saveEntry(\''+id+'\')">Clock out now</button>':'')+
    '<button class="b" onclick="saveEntry(\''+(id||'')+'\')">Save</button>'+(id?'<button class="b ghost" style="color:var(--red)" onclick="if(confirm(\'Delete this entry?\'))act(\'delete_entry\',{p_token:TOKEN,p_id:\''+id+'\'},closeSheet)">Delete</button>':'')+'<button class="b ghost" onclick="closeSheet()">Cancel</button>');

function saveEntry(id){var d=$('ed').value,s=localIso(d,$('es').value),en=$('ee').value?localIso(d,$('ee').value):'';if(en&&en<=s)en=new Date(new Date(en).getTime()+864e5).toISOString();
  act('save_entry',{p_token:TOKEN,e:{id:id,person_id:$('ep').value,job_id:$('ej').value||null,start_at:s,end_at:en,note:$('en').value,billable:$('eb').checked}},function(){closeSheet();toast('Saved');});}
function tReq(){
  var pend=S.requests.filter(function(r){return r.status==='pending';}),done=S.requests.filter(function(r){return r.status!=='pending';}).slice(0,30);
  var ytd={};S.requests.forEach(function(r){if(r.status!=='approved'||['Sick','PTO','Holiday','Unpaid'].indexOf(r.type)<0||r.day.slice(0,4)!==today().slice(0,4))return;var k=person(r.person_id).name;ytd[k]=ytd[k]||{};ytd[k][r.type]=(ytd[k][r.type]||0)+(+r.hours);});

      '<div class="row" style="margin-top:6px"><button class="s pri" onclick="act(\'decide_request\',{p_token:TOKEN,p_id:\''+q.id+'\',p_ok:true,p_note:\'\'})">Approve</button><button class="s" onclick="var n=prompt(\'Reason (optional)\');if(n!==null)act(\'decide_request\',{p_token:TOKEN,p_id:\''+q.id+'\',p_ok:false,p_note:n})">Deny</button></div></div>';}).join('')+'</div>':'<div class="mut">Nothing waiting</div>')+'</div>'+
    '<button class="b alt" style="margin:0 0 12px" onclick="addLeaveForm()">Add sick / PTO / holiday / unpaid</button>'+
    (Object.keys(ytd).length?'<div class="card"><h2>Time off this year</h2>'+Object.keys(ytd).map(function(p){return '<div><b>'+esc(p)+'</b> · '+Object.keys(ytd[p]).map(function(t){return esc(t)+' '+f2(ytd[p][t])+' h';}).join(' · ')+'</div>';}).join('')+'</div>':'')+
    '<div class="card"><h2>Decided</h2>'+(done.length?'<div class="list">'+done.map(function(q){return '<div class="row"><div class="f">'+esc(person(q.person_id).name)+' · '+esc(q.type)+' · '+dlbl(q.day)+' · '+f2(q.hours)+' h'+(q.note?'<div class="mut sm">'+esc(q.note)+'</div>':'')+'</div><span class="pill '+(q.status==='approved'?'':'red')+'">'+q.status+'</span></div>';}).join('')+'</div>':'<div class="mut">None</div>')+'</div>';

  sheet('<h3>Add time off</h3><label>Person</label><select id="ap">'+staff().map(function(p){return '<option value="'+p.id+'">'+esc(p.name)+'</option>';}).join('')+'</select><label>Type</label><select id="at"><option>Sick</option><option>PTO</option><option>Holiday</option><option>Unpaid</option></select>'+

function tBill(){
  var g={},ready=0,hold=0;
  S.jobs.forEach(function(j){var x=billSum(j);if(!(x.ready||x.hold))return;ready+=x.ready;hold+=x.hold;var c=billGroup(j);(g[c]=g[c]||[]).push({j:j,s:x});});

function backupNow(){rpc('backup_now',{p_token:TOKEN}).then(function(b){var a=document.createElement('a');a.href=URL.createObjectURL(new Blob([JSON.stringify(b,null,1)],{type:'application/json'}));a.download='YA Hub backup '+today()+'.json';document.body.appendChild(a);a.click();a.remove();toast('Backup downloaded');}).catch(function(e){alert(e.message);});}
function tPeople(){
  var shop=S.settings.shop;
  return '<button class="b" style="margin:0 0 12px" onclick="personForm(\'\')">+ Add person</button><div class="card"><div class="list">'+S.people.map(function(p){return '<div class="tap" onclick="personForm(\''+p.id+'\')"><div class="row"><div class="f"><b>'+esc(p.name)+'</b></div><span class="pill '+(p.active?'':'gray')+'">'+p.role+'</span></div><div class="mut sm">'+(/^\d{4}$/.test(p.code||'')?'code '+esc(p.code):'no login')+(p.note?' · '+esc(p.note):'')+'</div></div>';}).join('')+'</div></div>'+

function addPlace(){var n=prompt('Name this location (for example: YA shop)');if(!n)return;busy(true);where().then(function(l){if(l.lat==null){busy(false);return alert('Could not get your location. Allow location for this site and try again.');}

function csvPeriod(){
  var per=PER||periodOf(today());var rows=[['Person','Payroll','Date','Start','End','Hours','Customer','Job','Billable','Note']];
  S.entries.filter(function(e){var d=ymd(e.start_at);return d>=per.start&&d<=per.end&&e.end_at;}).forEach(function(e){var j=job(e.job_id);rows.push([person(e.person_id).name,person(e.person_id).role==='employee'?'yes':'no (owner)',ymd(e.start_at),tm(e.start_at),tm(e.end_at),f2(hrs(e.start_at,e.end_at)),j&&j.customer||'',j?j.name:'',e.billable?'yes':'no',e.note||'']);});
  S.requests.filter(function(r){return r.status==='approved'&&r.day>=per.start&&r.day<=per.end&&['Sick','PTO','Holiday','Unpaid'].indexOf(r.type)>=0;}).forEach(function(r){rows.push([person(r.person_id).name,'yes',r.day,'','',f2(r.hours),'',r.type+' (time off)','',r.note||'']);});
  var csv=rows.map(function(r){return r.map(function(c){c=String(c);return /[",\n]/.test(c)?'"'+c.replace(/"/g,'""')+'"':c;}).join(',');}).join('\n');
  var a=document.createElement('a');a.href=URL.createObjectURL(new Blob([csv],{type:'text/csv'}));a.download='YA hours '+per.start+' to '+per.end+'.csv';document.body.appendChild(a);a.click();a.remove();
}
